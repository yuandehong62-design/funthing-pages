<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理后台 · FunThing</title>
<style>
  :root{
    --bg:#0f1117; --card:#191c26; --card2:#20242f; --line:#2c3140;
    --txt:#e8eaf0; --sub:#9aa2b4; --acc:#ff7b3d; --acc2:#4da3ff;
    --ok:#3ddc84; --bad:#ff5d5d; --warn:#ffc94d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .hidden{display:none!important}

  /* 登录 */
  #loginBox{max-width:360px;margin:12vh auto;padding:32px 28px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center}
  #loginBox h1{font-size:22px;margin-bottom:6px}
  #loginBox p{color:var(--sub);font-size:13px;margin-bottom:22px}
  #loginBox input{width:100%;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:15px;outline:none;text-align:center;letter-spacing:2px}
  #loginBox input:focus{border-color:var(--acc)}
  #loginBox button{margin-top:14px;width:100%;padding:12px;background:var(--acc);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
  #loginBox button:hover{opacity:.9}
  #loginMsg{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px;white-space:pre-line}

  /* 布局 */
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:18px}
  .tabs{display:flex;gap:8px;margin-left:8px}
  .tab{padding:8px 16px;background:var(--card2);border:1px solid var(--line);border-radius:20px;color:var(--sub);cursor:pointer;font-size:14px}
  .tab.active{background:var(--acc);border-color:var(--acc);color:#fff}
  .spacer{flex:1}
  .btn{padding:8px 14px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--txt);cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--acc)}
  .btn.danger{color:var(--bad)}
  .btn.danger:hover{border-color:var(--bad)}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .count{color:var(--sub);font-size:13px}

  /* 留言 */
  .msg{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .msg .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .msg .name{font-weight:600}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--sub);border:1px solid var(--line)}
  .msg .time{color:var(--sub);font-size:12px}
  .msg .text{color:var(--txt);line-height:1.6;word-break:break-word;white-space:pre-wrap}
  .msg .ops{display:flex;gap:8px}

  /* 文件 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .file{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .file .thumb{height:130px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .file .thumb img{width:100%;height:100%;object-fit:cover}
  .file .thumb .ic{font-size:40px}
  .file .info{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .file .fname{font-size:13px;word-break:break-all;line-height:1.4}
  .file .meta{color:var(--sub);font-size:11px}
  .file .ops{display:flex;gap:6px;padding:0 12px 12px}
  .file .ops .btn{flex:1;text-align:center;padding:6px 4px;font-size:12px}

  #toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#2a2f3d;border:1px solid var(--line);color:var(--txt);padding:12px 22px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw}
  #toast.show{opacity:1}
  #toast.ok{border-color:var(--ok);color:var(--ok)}
  #toast.err{border-color:var(--bad);color:var(--bad)}
  .empty{color:var(--sub);text-align:center;padding:40px 0;font-size:14px}
  .loading{color:var(--sub);text-align:center;padding:40px 0}

  /* 余票管理 */
  .stock-note{color:var(--sub);font-size:13px;margin-bottom:14px}
  .stock-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap}
  .stock-row .city{font-weight:600;min-width:60px}
  .stock-row .sub{color:var(--sub);font-size:12px;flex:1;min-width:140px}
  .stock-field{display:flex;align-items:center;gap:6px}
  .stock-field label{font-size:12px;color:var(--sub);white-space:nowrap}
  .stock-field input{width:64px;padding:6px 8px;background:var(--card2);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:13px;outline:none;text-align:center}
  .stock-field input:focus{border-color:var(--acc)}
  .stock-save{padding:8px 14px;background:var(--acc);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px}
  .stock-save:hover{opacity:.9}
  .stock-reset{padding:8px 12px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--sub);cursor:pointer;font-size:12px}
  .stock-reset:hover{border-color:var(--warn);color:var(--warn)}

  /* 音乐管理 */
  .music-note{color:var(--sub);font-size:13px;margin-bottom:14px;line-height:1.7}
  .music-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .music-tools .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .track{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
  .track.dragging{opacity:.4}
  .track.dragover{border-color:var(--acc);border-style:dashed}
  .track .idx{width:34px;text-align:center;color:var(--acc);font-weight:600;font-size:14px;flex:none}
  .track .handle{cursor:grab;color:var(--sub);font-size:16px;flex:none;user-select:none}
  .track .handle:active{cursor:grabbing}
  .track .names{flex:1;min-width:180px;display:flex;flex-direction:column;gap:3px}
  .track .tname{font-size:14px;word-break:break-word}
  .track .tartist{color:var(--sub);font-size:12px}
  .track .src{font-size:11px;color:var(--sub);background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;flex:none}
  .track .src.qiniu{color:var(--acc2);border-color:var(--acc2)}
  .track .ops{display:flex;gap:6px;flex-wrap:wrap}
  .track .ops .btn{padding:5px 9px;font-size:12px}
  .track .ops .btn[disabled]{opacity:.35;cursor:not-allowed}
  .up-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .up-progress{flex:1;min-width:160px;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
  .up-progress i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
  .up-text{font-size:12px;color:var(--sub);min-width:90px}
</style>
</head>
<body>

<div id="loginBox">
  <h1>🔐 管理后台</h1>
  <p>留言 · 投稿墙 · 余票统一管理</p>
  <input type="password" id="pwdInput" placeholder="输入管理密码" autocomplete="current-password">
  <button id="loginBtn">登 录</button>
  <div id="loginMsg"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🎛️ 管理后台</h1>
    <div class="tabs">
      <button class="tab active" data-tab="msg">💬 留言管理</button>
      <button class="tab" data-tab="file">🖼️ 投稿墙管理</button>
      <button class="tab" data-tab="stock">🎟️ 余票管理</button>
      <button class="tab" data-tab="music">🎵 音乐管理</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="refreshBtn">🔄 刷新</button>
    <button class="btn danger" id="logoutBtn">退出</button>
  </header>
  <main>
    <div class="toolbar"><span class="count" id="countLine"></span></div>
    <div id="msgPanel"></div>
    <div id="filePanel" class="hidden"></div>
    <div id="stockPanel" class="hidden"></div>
    <div id="musicPanel" class="hidden"></div>
  </main>
</div>

<div id="toast"></div>

<script>
const API = '/api/admin';
let pwd = localStorage.getItem('admin_pwd') || '';
let currentTab = 'msg';

const $ = s => document.querySelector(s);
const deviceLabels = { ios:'🍎 苹果', android:'🤖 安卓', windows:'🪟 Windows', mac:'💻 Mac', linux:'🐧 Linux', unknown:'❓ 未知' };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(text, type){
  const t = $('#toast');
  t.textContent = text;
  t.className = 'show ' + (type || '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

function fmtTime(t){
  if (!t) return '';
  const d = new Date(t);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtSize(b){
  if (!b && b !== 0) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

async function api(action, extra){
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Password': pwd },
    body: JSON.stringify(Object.assign({ action }, extra || {}))
  });
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (res.status === 401) {
    localStorage.removeItem('admin_pwd');
    showLogin('密码错误，请重新输入');
    throw new Error('unauthorized');
  }
  if (res.status === 503 && data && data.setup) {
    localStorage.removeItem('admin_pwd');
    showLogin(data.error);
    throw new Error('setup');
  }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

function showLogin(msg){
  $('#app').classList.add('hidden');
  $('#loginBox').classList.remove('hidden');
  $('#loginMsg').textContent = msg || '';
  $('#pwdInput').value = '';
}

/* ---- 登录 ---- */
async function tryLogin(){
  const v = $('#pwdInput').value.trim();
  if (!v) return;
  pwd = v;
  try {
    await api('ping');
    localStorage.setItem('admin_pwd', pwd);
    $('#loginBox').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#loginMsg').textContent = '';
    refresh();
  } catch(e){ /* 错误信息已由 api() 处理 */ }
}
$('#loginBtn').onclick = tryLogin;
$('#pwdInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

/* ---- 标签页 ---- */
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    $('#msgPanel').classList.toggle('hidden', currentTab !== 'msg');
    $('#filePanel').classList.toggle('hidden', currentTab !== 'file');
    $('#stockPanel').classList.toggle('hidden', currentTab !== 'stock');
    $('#musicPanel').classList.toggle('hidden', currentTab !== 'music');
    refresh();
  };
});

$('#refreshBtn').onclick = refresh;
$('#logoutBtn').onclick = () => { localStorage.removeItem('admin_pwd'); showLogin(); };

async function refresh(){
  $('#countLine').textContent = '';
  if (currentTab === 'msg') await loadMessages();
  else if (currentTab === 'file') await loadFiles();
  else if (currentTab === 'music') await loadMusic();
  else await loadStock();
}

/* ---- 留言管理 ---- */
async function loadMessages(){
  const p = $('#msgPanel');
  p.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const d = await api('listMessages');
    const msgs = d.messages || [];
    $('#countLine').textContent = '共 ' + msgs.length + ' 条留言';
    if (!msgs.length) { p.innerHTML = '<div class="empty">暂无留言</div>'; return; }
    p.innerHTML = msgs.map(m => {
      const device = deviceLabels[m.device] || m.device || '';
      const ip = m.ip ? ('<span class="badge">IP ' + esc(m.ip) + '</span>') : '';
      const dev = device ? ('<span class="badge">' + esc(device) + '</span>') : '';
      return '<div class="msg">'
        + '<div class="head"><span class="name">' + esc(m.name) + '</span>' + dev + ip
        + '<span class="time">' + esc(fmtTime(m.time)) + '</span></div>'
        + '<div class="text">' + esc(m.text) + '</div>'
        + '<div class="ops">'
        + '<button class="btn" data-op="rename" data-key="' + esc(m.key) + '" data-name="' + esc(m.name) + '">✏️ 改昵称</button>'
        + '<button class="btn" data-op="edit" data-key="' + esc(m.key) + '" data-text="' + esc(m.text) + '">📝 改内容</button>'
        + '<button class="btn danger" data-op="del" data-key="' + esc(m.key) + '" data-name="' + esc(m.name) + '">🗑️ 删除</button>'
        + '</div></div>';
    }).join('');
    p.querySelectorAll('[data-op]').forEach(btn => {
      btn.onclick = () => msgOp(btn);
    });
  } catch(e){
    p.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

async function msgOp(btn){
  const op = btn.dataset.op, key = btn.dataset.key;
  try {
    if (op === 'rename') {
      const name = prompt('把「' + btn.dataset.name + '」改名为：', btn.dataset.name);
      if (name === null) return;
      await api('editMessage', { key, name });
      toast('昵称已修改', 'ok');
    } else if (op === 'edit') {
      const text = prompt('修改留言内容：', btn.dataset.text);
      if (text === null) return;
      await api('editMessage', { key, text });
      toast('内容已修改', 'ok');
    } else if (op === 'del') {
      if (!confirm('确定删除「' + btn.dataset.name + '」的这条留言吗？删除后不可恢复。')) return;
      await api('deleteMessage', { key });
      toast('留言已删除', 'ok');
    }
    loadMessages();
  } catch(e){
    toast('操作失败：' + e.message, 'err');
  }
}

/* ---- 投稿墙管理 ---- */
async function loadFiles(){
  const p = $('#filePanel');
  p.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const d = await api('listFiles');
    const items = d.items || [];
    $('#countLine').textContent = '共 ' + items.length + ' 个文件';
    if (!items.length) { p.innerHTML = '<div class="empty">投稿墙暂无文件</div>'; return; }
    p.innerHTML = '<div class="grid">' + items.map(f => {
      const isImg = /^image\//.test(f.mimeType || '');
      const thumb = isImg
        ? '<img src="' + esc(f.url) + '" loading="lazy" alt="">'
        : '<div class="ic">📄</div>';
      return '<div class="file">'
        + '<div class="thumb">' + thumb + '</div>'
        + '<div class="info">'
        + '<div class="fname">' + esc(f.key) + '</div>'
        + '<div class="meta">' + esc(fmtSize(f.size)) + ' · ' + esc(fmtTime(f.putTime / 10000)) + '</div>'
        + '</div>'
        + '<div class="ops">'
        + '<button class="btn" data-op="rename" data-key="' + esc(f.key) + '">✏️ 改名</button>'
        + '<a class="btn" href="' + esc(f.url) + '" target="_blank" style="text-decoration:none">👁️ 查看</a>'
        + '<button class="btn danger" data-op="del" data-key="' + esc(f.key) + '">🗑️ 删除</button>'
        + '</div></div>';
    }).join('') + '</div>';
    p.querySelectorAll('[data-op]').forEach(btn => {
      btn.onclick = () => fileOp(btn);
    });
  } catch(e){
    p.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

async function fileOp(btn){
  const op = btn.dataset.op, key = btn.dataset.key;
  try {
    if (op === 'rename') {
      const ext = key.includes('.') ? key.slice(key.lastIndexOf('.')) : '';
      const base = ext ? key.slice(0, key.lastIndexOf('.')) : key;
      const nk = prompt('把「' + key + '」改名为（会自动保留扩展名' + ext + '）：', base);
      if (nk === null) return;
      const newKey = (nk + ext).replace(/\s+/g, '_');
      if (!/^[A-Za-z0-9_.\-]{1,200}$/.test(newKey)) {
        toast('文件名只能包含字母、数字、下划线、点和短横线', 'err');
        return;
      }
      await api('renameFile', { key, newKey });
      toast('已改名为「' + newKey + '」', 'ok');
    } else if (op === 'del') {
      if (!confirm('确定删除「' + key + '」吗？投稿墙和所有人的浏览都会立即看不到它，且不可恢复。')) return;
      await api('deleteFile', { key });
      toast('文件已删除', 'ok');
    }
    loadFiles();
  } catch(e){
    toast('操作失败：' + e.message, 'err');
  }
}

/* ---- 余票管理 ---- */
const scheduleData = [
  { id:'shanghai2025', city:'广州', venue:'广东第二师范学院附属南沙珠江中学', date:'2026-10-03' },
  { id:'tokyo2025', city:'东京', venue:'国立代々木競技場', date:'2026-11-02' },
  { id:'newyork2025', city:'纽约', venue:'Lincoln Center', date:'2026-11-18' },
  { id:'london2025', city:'伦敦', venue:'Royal Albert Hall', date:'2029-11-05' },
  { id:'berlin2025', city:'柏林', venue:'Berghain', date:'2027-08-22' },
  { id:'shanghai2025', city:'广州', venue:'地点未知？LD家？还是学校？', date:'2027-07-03' },
  { id:'sydney2025', city:'悉尼', venue:'Sydney Opera House', date:'2089-09-10' }
];
const ticketTypeLabels = { normal:'普通票', premium:'高级票', vip:'VIP看台' };

async function loadStock(){
  const p = $('#stockPanel');
  p.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const d = await api('getStock');
    const stock = d.stock || {};
    const def = d.default || 80;
    $('#countLine').textContent = '共 ' + scheduleData.length + ' 个场次';
    p.innerHTML = '<div class="stock-note">修改余票后点击「保存」，访客端购票页与余票实时同步（云端存储，所有访客共享）。</div>'
      + scheduleData.map(s => {
        const t = stock[s.id] || { normal:def, premium:def, vip:def };
        return '<div class="stock-row" data-id="' + esc(s.id) + '">'
          + '<div class="city">' + esc(s.city) + '</div>'
          + '<div class="sub">' + esc(s.venue) + ' · ' + esc(s.date) + '</div>'
          + '<div class="stock-field"><label>' + ticketTypeLabels.normal + '</label><input type="number" min="0" data-type="normal" value="' + t.normal + '"></div>'
          + '<div class="stock-field"><label>' + ticketTypeLabels.premium + '</label><input type="number" min="0" data-type="premium" value="' + t.premium + '"></div>'
          + '<div class="stock-field"><label>' + ticketTypeLabels.vip + '</label><input type="number" min="0" data-type="vip" value="' + t.vip + '"></div>'
          + '<button class="stock-save" data-op="save">保存</button>'
          + '<button class="stock-reset" data-op="reset">恢复默认</button>'
          + '</div>';
      }).join('');
    p.querySelectorAll('[data-op]').forEach(btn => {
      btn.onclick = () => stockOp(btn);
    });
  } catch(e){
    p.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

async function stockOp(btn){
  const row = btn.closest('.stock-row');
  const showId = row.dataset.id;
  const op = btn.dataset.op;
  try {
    if (op === 'save') {
      const extra = { showId };
      row.querySelectorAll('input').forEach(inp => {
        extra[inp.dataset.type] = parseInt(inp.value, 10);
      });
      await api('setStock', extra);
      toast('余票已保存', 'ok');
    } else if (op === 'reset') {
      if (!confirm('把该场次余票恢复为默认 80 吗？')) return;
      await api('setStock', { showId, normal:80, premium:80, vip:80 });
      toast('已恢复默认', 'ok');
    }
    loadStock();
  } catch(e){
    toast('操作失败：' + e.message, 'err');
  }
}

/* ---- 音乐管理 ---- */
let musicTracks = [];       // 当前编辑中的歌单（本地副本，改动后才推到云端）
let musicUpdatedAt = null;
let musicMax = 300;
let musicDirty = false;

/* 网站内置歌单（csy.html 里的 SONG_NAMES / SONG_ARTISTS），
   云端还没建歌单时用它当种子，方便直接排序/编辑后就保存 */
const BUILTIN_MUSIC = [
  ['海屿你',''],['朋友的酒',''],['红色高跟鞋',''],['雨爱',''],['忘情牛肉面',''],
  ['你若三冬',''],['花海',''],['爱情讯息',''],['甲乙丙丁',''],['心墙',''],
  ['DreamFunk',''],['我来同你玩纯享版',''],
  ['泡沫','G.E.M.邓紫棋'],['我走后','小咪'],['特别的人','方大同'],['我们俩','郭顶'],['越来越不懂','蔡健雅'],
  ['NIGHT DANCER','imase'],['悬溺','葛东琪'],['Letting Go','蔡健雅'],['红色高跟鞋','蔡健雅'],['青衣','尘ah.'],
  ['バケモノの唄','Shino'],['怪咖','薛之谦'],['琵琶曲','郑浩Z-Hao'],['如果可以','DJ大大怪'],['花海','粉白噪音'],
  ['无人之岛','任然'],['其实','薛之谦'],['心墙','郭静'],['离开我的依赖','王艳薇'],['把回忆拼好给你','王贰浪'],
  ['第57次取消发送','菲菲公主'],['爱情讯息','郭静'],['雨爱','杨丞琳'],['海屿你','马也_Crabbit'],
  ['3Strikes(苹果进行曲)',''],['Die for you',''],['Ticking Away',''],['Wake','']
].map((v, i) => ({
  id: 'repo-' + (i + 1),
  name: v[0],
  artist: v[1],
  src: (i + 1) + '.mp3',
  type: 'repo',
  lrc: (i + 1) + '.lrc'
}));

function markMusicDirty(){ musicDirty = true; }

async function loadMusic(){
  const p = $('#musicPanel');
  p.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const d = await api('getMusic');
    musicTracks = (d.tracks || []).map(t => ({
      id: t.id, name: t.name, artist: t.artist || '',
      src: t.src, type: t.type || 'repo', lrc: t.lrc || ''
    }));
    musicUpdatedAt = d.updatedAt || null;
    musicMax = d.max || 300;
    musicDirty = false;
    if (!musicTracks.length) {
      // 云端还没歌单 → 用网站当前的内置歌单当草稿
      musicTracks = BUILTIN_MUSIC.map(t => Object.assign({}, t));
    }
    renderMusic();
  } catch(e){
    p.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

function renderMusic(){
  const p = $('#musicPanel');
  const total = musicTracks.length;
  $('#countLine').textContent = '共 ' + total + ' 首' + (musicDirty ? '（有未保存的改动）' : '');

  let html = '<div class="music-note">'
    + '这里管理棍涛舞团点播页（csy.html）的曲目表：可拖动排序、改名/歌手、删除，或上传新音乐。'
    + '改动点「保存到云端」后立即对全部访客生效，无需重新部署。'
    + (musicUpdatedAt ? '<br>上次保存：' + esc(fmtTime(musicUpdatedAt)) : '<br>云端还没有歌单，下面列出的是网站当前内置的曲目（直接改完保存即可接管）。')
    + '</div>';

  html += '<div class="music-tools">'
    + '<button class="btn primary" id="musicSaveBtn">💾 保存到云端</button>'
    + '<button class="btn" id="musicAddBtn">➕ 添加一首（手动填路径）</button>'
    + '<button class="btn" id="musicUpBtn">⬆️ 上传音乐（七牛云）</button>'
    + '<button class="btn" id="musicResetBtn">↩️ 放弃改动</button>'
    + '</div><div id="musicUpArea"></div>';

  if (!total) {
    html += '<div class="empty">歌单为空。<br>点「上传音乐」传一首，或「添加一首」手动填一个已存在的文件路径。</div>';
    p.innerHTML = html;
    bindMusicTools();
    return;
  }

  html += musicTracks.map((t, i) => {
    const isQ = t.type === 'qiniu';
    return '<div class="track" draggable="true" data-i="' + i + '">'
      + '<span class="handle" title="拖动排序">⠿</span>'
      + '<div class="idx">' + String(i + 1).padStart(2, '0') + '</div>'
      + '<div class="names">'
      + '<span class="tname">' + esc(t.name || '(未命名)') + '</span>'
      + '<span class="tartist">' + (t.artist ? esc(t.artist) : '未填歌手') + '</span>'
      + '</div>'
      + '<span class="src ' + (isQ ? 'qiniu' : '') + '">' + (isQ ? '☁️ 七牛' : '📁 站内') + '</span>'
      + '<div class="ops">'
      + '<button class="btn" data-mop="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>'
      + '<button class="btn" data-mop="down" data-i="' + i + '"' + (i === total - 1 ? ' disabled' : '') + '>↓</button>'
      + '<button class="btn" data-mop="edit" data-i="' + i + '">✏️ 编辑</button>'
      + '<button class="btn" data-mop="try" data-i="' + i + '">▶️ 试听</button>'
      + '<button class="btn danger" data-mop="del" data-i="' + i + '">🗑️ 删除</button>'
      + '</div></div>';
  }).join('');

  p.innerHTML = html;
  bindMusicTools();
  bindTrackDrag();
}

function bindMusicTools(){
  const save = $('#musicSaveBtn');
  if (save) save.onclick = saveMusic;
  const add = $('#musicAddBtn');
  if (add) add.onclick = addTrackManual;
  const up = $('#musicUpBtn');
  if (up) up.onclick = showUploadArea;
  const rs = $('#musicResetBtn');
  if (rs) rs.onclick = () => { if (!musicDirty) { toast('没有改动'); return; } if (confirm('放弃所有未保存的改动？')) loadMusic(); };
  document.querySelectorAll('#musicPanel [data-mop]').forEach(btn => {
    btn.onclick = () => trackOp(btn.dataset.mop, parseInt(btn.dataset.i, 10));
  });
}

/* 拖动排序 */
function bindTrackDrag(){
  const rows = document.querySelectorAll('#musicPanel .track');
  let dragFrom = -1;
  rows.forEach(row => {
    row.addEventListener('dragstart', e => {
      dragFrom = parseInt(row.dataset.i, 10);
      row.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', String(dragFrom)); } catch(_) {}
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      document.querySelectorAll('#musicPanel .track').forEach(r => r.classList.remove('dragover'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      row.classList.add('dragover');
    });
    row.addEventListener('dragleave', () => row.classList.remove('dragover'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('dragover');
      const to = parseInt(row.dataset.i, 10);
      let from = dragFrom;
      try { const s = e.dataTransfer.getData('text/plain'); if (s !== '' && !isNaN(parseInt(s,10))) from = parseInt(s,10); } catch(_) {}
      if (isNaN(from) || from === to || from < 0) return;
      moveTrack(from, to);
    });
  });
}

function moveTrack(from, to){
  if (from === to || from < 0 || to < 0 || from >= musicTracks.length || to >= musicTracks.length) return;
  const t = musicTracks.splice(from, 1)[0];
  musicTracks.splice(to, 0, t);
  markMusicDirty();
  renderMusic();
}

function trackOp(op, i){
  const t = musicTracks[i];
  if (!t) return;
  if (op === 'up') { moveTrack(i, i - 1); return; }
  if (op === 'down') { moveTrack(i, i + 1); return; }
  if (op === 'edit') {
    const name = prompt('曲目名（显示在卡片上）：', t.name || '');
    if (name === null) return;
    const artist = prompt('歌手（可留空）：', t.artist || '');
    if (artist === null) return;
    t.name = name.trim().slice(0, 120) || t.name;
    t.artist = artist.trim().slice(0, 120);
    markMusicDirty();
    renderMusic();
    return;
  }
  if (op === 'try') {
    // 站内文件在棍涛舞团站点根目录，七牛文件走它自己的音频代理
    const realUrl = t.type === 'qiniu'
      ? ('https://guntaodance.pages.dev/api/music-file?key=' + encodeURIComponent(t.src))
      : ('https://guntaodance.pages.dev/' + t.src);
    window.open(realUrl, '_blank');
    return;
  }
  if (op === 'del') {
    let alsoCloud = false;
    if (t.type === 'qiniu') {
      alsoCloud = confirm('确定从歌单里删除「' + (t.name || t.src) + '」吗？\n\n点「确定」= 同时删除七牛云上的文件（省存储）\n点「取消」= 只从歌单移除，云端文件保留');
    } else {
      if (!confirm('确定从歌单里删除「' + (t.name || t.src) + '」吗？（站内文件不会被删除）')) return;
    }
    musicTracks.splice(i, 1);
    markMusicDirty();
    renderMusic();
    if (alsoCloud) {
      api('deleteMusic', { key: t.src })
        .then(() => toast('已从歌单移除，并删除了云端文件', 'ok'))
        .catch(e => toast('歌单已移除，但云端文件删除失败：' + e.message, 'err'));
    }
    return;
  }
}

function addTrackManual(){
  const src = prompt('文件路径（站内文件如 41.mp3，或七牛 key 如 music/xxx.mp3）：', '');
  if (src === null) return;
  const clean = src.trim();
  if (!clean) return;
  const name = prompt('曲目名：', '');
  if (name === null) return;
  const artist = prompt('歌手（可留空）：', '');
  if (artist === null) return;
  const isQ = clean.indexOf('music/') === 0;
  musicTracks.push({
    id: 'k' + Date.now().toString(36),
    name: (name.trim() || clean).slice(0, 120),
    artist: (artist.trim()).slice(0, 120),
    src: clean,
    type: isQ ? 'qiniu' : 'repo',
    lrc: isQ ? '' : (clean.replace(/\.[^.]+$/, '') + '.lrc')
  });
  markMusicDirty();
  renderMusic();
  toast('已添加到列表，记得点「保存到云端」', 'ok');
}

/* 上传到七牛 */
function showUploadArea(){
  const area = $('#musicUpArea');
  if (!area) return;
  if (area.dataset.open === '1') { area.innerHTML = ''; area.dataset.open = '0'; return; }
  area.dataset.open = '1';
  area.innerHTML = '<div style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px">'
    + '<div style="font-size:13px;color:var(--sub);margin-bottom:10px;line-height:1.7">'
    + '选择要上传的音频文件（mp3 / flac / m4a / wav 等），会传到七牛云并自动加进歌单。<br>'
    + '文件名会作为曲目名初稿，稍后可编辑。上传完成后记得点「保存到云端」。</div>'
    + '<input type="file" id="musicFileInput" accept="audio/*,.mp3,.flac,.m4a,.wav,.ogg,.aac" multiple>'
    + '<div class="up-row"><div class="up-progress"><i id="upBar"></i></div><span class="up-text" id="upText">等待选择</span></div>'
    + '</div>';
  $('#musicFileInput').onchange = e => doUpload(Array.from(e.target.files || []));
}

async function doUpload(files){
  if (!files.length) return;
  for (let k = 0; k < files.length; k++) {
    const file = files[k];
    if (!file) continue;
    const bar = $('#upBar'), txt = $('#upText');
    if (txt) txt.textContent = '(' + (k + 1) + '/' + files.length + ') ' + file.name;
    try {
      const safeName = (file.name || 'audio.mp3').replace(/[^\w.\-]+/g, '_').slice(-60);
      const tk = await api('musicToken', { name: safeName });
      if (!tk || !tk.ok) throw new Error('取上传凭证失败');
      await putToQiniu(tk, file, pct => {
        if (bar) bar.style.width = (pct * 100).toFixed(1) + '%';
        if (txt) txt.textContent = '(' + (k + 1) + '/' + files.length + ') ' + file.name + ' · ' + Math.round(pct * 100) + '%';
      });
      const baseName = file.name.replace(/\.[^.]+$/, '');
      musicTracks.push({
        id: 'k' + Date.now().toString(36) + Math.floor(Math.random() * 1000),
        name: baseName.slice(0, 120),
        artist: '',
        src: tk.key,
        type: 'qiniu',
        lrc: ''
      });
      markMusicDirty();
    } catch(e){
      toast('「' + file.name + '」上传失败：' + e.message, 'err');
    }
  }
  const bar = $('#upBar'), txt = $('#upText');
  if (bar) bar.style.width = '100%';
  if (txt) txt.textContent = '上传完成，请点「保存到云端」';
  renderMusic();
  toast('上传完成，请点「保存到云端」生效', 'ok');
}

function putToQiniu(tk, file, onProgress){
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('token', tk.token);
    fd.append('key', tk.key);
    fd.append('file', file);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', tk.uploadUrl || 'https://upload-z2.qiniup.com', true);
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error('七牛返回 ' + xhr.status + ' ' + (xhr.responseText || '').slice(0, 120)));
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.ontimeout = () => reject(new Error('超时'));
    xhr.send(fd);
  });
}

async function saveMusic(){
  const save = $('#musicSaveBtn');
  if (save) { save.disabled = true; save.textContent = '保存中…'; }
  try {
    const payload = musicTracks.map((t, i) => ({
      id: t.id || ('k' + i),
      name: t.name || ('曲目' + (i + 1)),
      artist: t.artist || '',
      src: t.src,
      type: t.type === 'qiniu' ? 'qiniu' : 'repo',
      lrc: t.lrc || ''
    }));
    const d = await api('setMusic', { tracks: payload });
    musicUpdatedAt = (d && d.updatedAt) || new Date().toISOString();
    musicDirty = false;
    toast('歌单已保存到云端，全部访客立即生效', 'ok');
    renderMusic();
  } catch(e){
    toast('保存失败：' + e.message, 'err');
  } finally {
    if (save) { save.disabled = false; save.textContent = '💾 保存到云端'; }
  }
}

    $('#app').classList.remove('hidden');
    refresh();

} else {

}
