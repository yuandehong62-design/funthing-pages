<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShareMore 投稿墙</title>
<style>
    :root { 
        --bg: #0a0e1a; 
        --border: rgba(0, 212, 255, 0.15); 
        --accent: #00d4ff; 
        --text: #e2e8f0; 
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    
    .topbar { text-align: center; margin-bottom: 24px; }
    .title { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color:#aaa; font-size:0.8rem; margin-top:6px; }

    /* 标签页切换 */
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 22px; }
    .tab { padding: 9px 22px; border-radius: 999px; border: 1px solid var(--border); background: rgba(20, 26, 42, 0.72); color: #9aa; cursor: pointer; font-size: 0.85rem; transition: 0.25s; }
    .tab:hover { border-color: var(--accent); color: #fff; }
    .tab.on { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    .panel { display: none; }
    .panel.on { display: block; }

    /* 留言板 */
    .msg-form { background: rgba(20, 26, 42, 0.72); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 26px; }
    .msg-row { display: flex; gap: 10px; }
    .msg-input { flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 0.85rem; outline: none; transition: 0.25s; }
    .msg-input:focus { border-color: var(--accent); }
    .msg-input::placeholder { color: rgba(255,255,255,0.35); }
    .msg-name-input { max-width: 180px; }
    .msg-submit { padding: 11px 22px; border-radius: 12px; border: none; background: var(--accent); color: #000; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.25s; }
    .msg-submit:hover { filter: brightness(1.1); }
    .msg-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg-hint { margin-top: 10px; font-size: 0.7rem; color: #777; text-align: center; }

    .msg-list { display: flex; flex-direction: column; gap: 12px; }
    .msg-item { background: rgba(20, 26, 42, 0.72); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; }
    .msg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .msg-name { font-size: 0.82rem; font-weight: 700; color: var(--accent); }
    .msg-time { font-size: 0.68rem; color: #777; }
    .msg-text { font-size: 0.88rem; color: var(--text); line-height: 1.7; word-break: break-word; white-space: pre-wrap; }
    .msg-empty { text-align: center; color: #666; font-size: 0.88rem; padding: 28px 0; }

    /* 上传区 */
    .upload-box { 
        background: rgba(20, 26, 42, 0.72); 
        border: 1px dashed var(--border); 
        border-radius: 16px; 
        padding: 30px; 
        text-align: center; 
        margin-bottom: 30px; 
        transition: 0.3s; 
        cursor: pointer; 
    }
    .upload-box:hover { border-color: var(--accent); background: rgba(0, 212, 255, 0.05); }
    .upload-box input[type="file"] { display: none; }
    .upload-icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.7; }
    .upload-text { font-size: 0.9rem; color: rgba(255,255,255,0.5); }
    
    .progress { margin-top: 15px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; display: none; }
    .bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
    #result { margin-top: 15px; color: #6ee7b7; font-size: 0.9rem; word-break: break-all; }
    #result a { color: var(--accent); text-decoration: none; font-weight: bold; margin-left: 5px; border-bottom: 1px solid transparent; transition: 0.2s; }
    #result a:hover { border-bottom-color: var(--accent); }

    /* 画廊列表 */
    .gallery-title { font-size: 1.1rem; color: #fff; margin-bottom: 15px; padding-left: 10px; border-left: 3px solid var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .file-card { background: rgba(20, 26, 42, 0.72); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; }
    .file-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,212,255,0.1); }
    
    .preview-box { width: 100%; height: 140px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .preview-box .icon { font-size: 3rem; opacity: 0.5; }
    
    .file-info { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .file-name { font-size: 0.85rem; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 0.72rem; color: #888; }
    .file-link { margin-top: auto; display: block; text-align: center; padding: 6px; background: rgba(0,212,255,0.1); color: var(--accent); text-decoration: none; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    .file-link:hover { background: var(--accent); color: #000; }
    
    .empty-tip { text-align: center; color: #666; font-size: 0.9rem; padding: 30px 0; display: none; }
</style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="title">✦ ShareMore 投稿墙 ✦</div>
        <p class="subtitle">匿名留言 · 分享照片、视频及普通文件（限 50MB）</p>
    </div>

    <!-- 标签页 -->
    <div class="tabs">
        <div class="tab on" id="tabMsg" onclick="switchTab('msg')">💬 匿名留言</div>
        <div class="tab" id="tabFile" onclick="switchTab('file')">📤 文件投稿</div>
    </div>

    <!-- 留言板 -->
    <div class="panel on" id="panelMsg">
        <div class="msg-form">
            <div class="msg-row">
                <input type="text" class="msg-input msg-name-input" id="msgName" maxlength="16" placeholder="昵称（可留空）">
                <button class="msg-submit" id="msgSubmitBtn" onclick="submitMsg()">发布留言</button>
            </div>
            <textarea class="msg-input" id="msgText" maxlength="200" placeholder="想说点什么？无需记名，友善发言哦～" style="width:100%; margin-top:10px; resize:vertical;"></textarea>
            <p class="msg-hint">留言全网公开可见 · 无需登录 · 内容友善文明</p>
        </div>
        <div class="msg-list" id="msgList"></div>
    </div>

    <!-- 文件投稿 -->
    <div class="panel" id="panelFile">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📤</div>
            <div class="upload-text">点击这里选择文件上传</div>
            <input type="file" id="fileInput" onchange="uploadFile(this.files)">
            <div class="progress" id="progBox"><div class="bar" id="progBar"></div></div>
            <div id="result" onclick="event.stopPropagation()"></div>
        </div>

        <div class="gallery-title">📂 所有人的投稿</div>
        <div class="grid" id="fileGrid"></div>
        <div class="empty-tip" id="emptyTip">暂无记录，快去传个文件试试吧~</div>
    </div>
</div>

<script>
const QINIU_UPLOAD_URL = 'https://upload-z2.qiniup.com'; // 华南区上传地址

/* ============ 标签页切换 ============ */
function switchTab(which) {
    document.getElementById('tabMsg').classList.toggle('on', which === 'msg');
    document.getElementById('tabFile').classList.toggle('on', which === 'file');
    document.getElementById('panelMsg').classList.toggle('on', which === 'msg');
    document.getElementById('panelFile').classList.toggle('on', which === 'file');
    if (which === 'msg') fetchMessages();
}

/* ============ 匿名留言 ============ */
let messages = [];
let msgLoadState = 'idle'; // idle | loading | ok | fail

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTime(t) {
    if (!t) return '';
    try { return new Date(t).toLocaleString('zh-CN', { hour12: false }); }
    catch (e) { return String(t); }
}

function renderMessages() {
    const list = document.getElementById('msgList');
    if (!list) return;
    if (msgLoadState === 'loading' && !messages.length) {
        list.innerHTML = '<div class="msg-empty">⏳ 正在加载留言…</div>';
        return;
    }
    if (msgLoadState === 'fail' && !messages.length) {
        list.innerHTML = '<div class="msg-empty">⚠️ 留言加载失败，请检查网络后刷新页面重试</div>';
        return;
    }
    if (!messages.length) {
        list.innerHTML = '<div class="msg-empty">还没有留言，来抢沙发吧～</div>';
        return;
    }
    list.innerHTML = messages.map(m =>
        `<div class="msg-item">
            <div class="msg-head"><span class="msg-name">${escapeHtml(m.name || '匿名')}</span><span class="msg-time">${escapeHtml(fmtTime(m.time))}</span></div>
            <div class="msg-text">${escapeHtml(m.text)}</div>
         </div>`
    ).join('');
}

async function fetchMessages() {
    msgLoadState = 'loading';
    renderMessages();
    try {
        const res = await fetch('/api/messages?_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data || !data.ok || !Array.isArray(data.messages)) throw new Error('bad payload');
        messages = data.messages.slice().reverse(); // 服务器新→旧，转为旧→新
        msgLoadState = 'ok';
        renderMessages();
    } catch (e) {
        msgLoadState = 'fail';
        renderMessages();
    }
}

async function submitMsg() {
    const nameEl = document.getElementById('msgName');
    const textEl = document.getElementById('msgText');
    const name = nameEl.value.trim() || '匿名';
    const text = textEl.value.trim();
    if (!text) { textEl.focus(); return; }

    const btn = document.getElementById('msgSubmitBtn');
    btn.disabled = true;
    btn.textContent = '发布中…';
    try {
        const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, text })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        nameEl.value = '';
        textEl.value = '';
        await fetchMessages();
    } catch (e) {
        alert('留言发布失败，请稍后重试');
    } finally {
        btn.disabled = false;
        btn.textContent = '发布留言';
    }
}

/* ============ 文件投稿 ============ */

// 文件下载/预览统一走同域代理 /api/sharewall-file?key=xxx
// （服务端已配好七牛域名，避免 HTTP 测试域名在 HTTPS 页面被浏览器拦截）

// 从云端拉取所有人上传的文件列表
async function renderGallery() {
    const grid = document.getElementById('fileGrid');
    const tip = document.getElementById('emptyTip');

    let items;
    try {
        const res = await fetch('/api/sharewall-list');
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        items = data.items || [];
    } catch (err) {
        tip.style.display = 'block';
        tip.textContent = '列表加载失败：' + err.message;
        grid.innerHTML = '';
        return;
    }

    if (items.length === 0) {
        tip.style.display = 'block';
        tip.textContent = '暂无记录，快去传个文件试试吧~';
        grid.innerHTML = '';
        return;
    }

    tip.style.display = 'none';
    grid.innerHTML = items.map(item => {
        const fileUrl = '/api/sharewall-file?key=' + encodeURIComponent(item.key);
        const isImage = (item.mimeType || '').startsWith('image/');
        const isVideo = (item.mimeType || '').startsWith('video/');
        let preview = '';
        if (isImage) {
            preview = `<img src="${fileUrl}" loading="lazy" onerror="imgFallback(this)">`;
        } else if (isVideo) {
            preview = `<div class="icon">🎬</div>`;
        } else {
            preview = `<div class="icon">📄</div>`;
        }

        return `
            <div class="file-card">
                <div class="preview-box">${preview}</div>
                <div class="file-info">
                    <div class="file-name" title="${escapeHtml(item.key)}">${escapeHtml(item.key)}</div>
                    <div class="file-meta">${formatSize(item.size)} · ${new Date(item.putTime / 10000).toLocaleString()}</div>
                    <a href="${fileUrl}" target="_blank" class="file-link">查看 / 下载</a>
                </div>
            </div>
        `;
    }).join('');
}

// 图片加载失败时，替换为图标占位
function imgFallback(img) {
    img.outerHTML = '<div class="icon">🖼️</div>';
}

function formatSize(bytes) {
    bytes = bytes || 0;
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
    return (bytes / 1073741824).toFixed(1) + ' GB';
}

// 处理上传
async function uploadFile(files) {
    if (!files.length) return;
    const file = files[0];
    if (file.size > 50 * 1024 * 1024) return alert("文件超过 50MB");

    const progBox = document.getElementById('progBox');
    const progBar = document.getElementById('progBar');
    const result = document.getElementById('result');
    
    progBox.style.display = 'block';
    progBar.style.width = '0%';
    result.innerHTML = '获取上传凭证中...';

    try {
        const res = await fetch('/api/qiniu-token', { method: 'POST' });
        const text = await res.text(); 
        
        if (!text) throw new Error('后端返回空内容，请检查 Functions 路由是否生效。');
        
        let data;
        try { data = JSON.parse(text); } 
        catch (e) { throw new Error('解析失败：' + text.substring(0, 50)); }
        
        if (data.error) throw new Error('后端报错: ' + data.error);

        const formData = new FormData();
        formData.append('token', data.token);
        formData.append('file', file);
        
        // 生成随机文件名
        const ext = file.name.split('.').pop();
        const key = Date.now() + '_' + Math.floor(Math.random()*10000) + '.' + ext;
        formData.append('key', key);

        result.innerHTML = '正在上传到七牛云...';

        const xhr = new XMLHttpRequest();
        xhr.open('POST', QINIU_UPLOAD_URL, true);
        
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) progBar.style.width = (e.loaded / e.total) * 100 + '%';
        };
        
        xhr.onload = function() {
            if (xhr.status === 200) {
                // 统一走同域代理，避免 HTTP 测试域名被 HTTPS 页面拦截
                const fileUrl = '/api/sharewall-file?key=' + encodeURIComponent(key);
                
                result.innerHTML = `✅ 上传成功！<a href="${fileUrl}" target="_blank" onclick="event.stopPropagation()">点击这里查看文件</a>`;
                progBox.style.display = 'none';
                document.getElementById('fileInput').value = ''; // 清空输入

                // 从云端重新拉取列表（所有人可见）
                renderGallery();

            } else {
                result.innerHTML = '❌ 七牛云报错：' + xhr.responseText;
                progBox.style.display = 'none';
            }
        };
        
        xhr.onerror = function() {
            result.innerHTML = '❌ 网络错误，上传失败';
            progBox.style.display = 'none';
        };
        
        xhr.send(formData);

    } catch (err) {
        result.innerHTML = '❌ 出错啦：' + err.message;
        progBox.style.display = 'none';
    }
}

// 页面加载时，渲染一次
window.onload = function() {
    fetchMessages();
    renderGallery();
};
</script>
</body>
</html>
