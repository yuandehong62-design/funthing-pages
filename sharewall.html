<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShareMore 公开投稿墙</title>
<style>
    :root { --bg: #0a0e1a; --border: rgba(0, 212, 255, 0.15); --accent: #00d4ff; --text: #e2e8f0; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    .topbar { text-align: center; margin-bottom: 20px; }
    .title { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* 上传区 */
    .upload-box { background: rgba(20, 26, 42, 0.72); border: 1px dashed var(--border); border-radius: 16px; padding: 30px; text-align: center; margin-bottom: 20px; transition: 0.3s; cursor: pointer; }
    .upload-box:hover { border-color: var(--accent); background: rgba(0, 212, 255, 0.05); }
    .upload-box input[type="file"] { display: none; }
    .upload-icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.7; }
    .upload-text { font-size: 0.9rem; color: rgba(255,255,255,0.5); }
    .progress { margin-top: 15px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; display: none; }
    .bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
    #result { margin-top: 10px; color: #6ee7b7; font-size: 0.85rem; word-break: break-all; }

    /* 提示 */
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1e2a; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--border); opacity: 0; transition: 0.3s; pointer-events: none; z-index: 9999; }
    .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="title">✦ ShareMore 投稿墙 ✦</div>
        <p style="color:#aaa; font-size:0.8rem; margin-top:6px;">支持照片、视频及普通文件（限 50MB）</p>
    </div>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📤</div>
        <div class="upload-text">点击这里选择文件上传</div>
        <input type="file" id="fileInput" onchange="uploadFile(this.files)">
        <div class="progress" id="progBox"><div class="bar" id="progBar"></div></div>
        <div id="result"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 👇【注意】你是华南空间，这里是对的，不用改
const QINIU_UPLOAD_URL = 'https://upload-z2.qiniup.com';
// 👇【注意】把引号里的内容换成你在七牛云的“测试域名”
const DOMAIN = "tn3b3bcgf.hn-bkt.clouddn.com"; 

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

async function uploadFile(files) {
    if (!files.length) return;
    const file = files[0];
    if (file.size > 50 * 1024 * 1024) return showToast("文件超过 50MB");

    const progBox = document.getElementById('progBox');
    const progBar = document.getElementById('progBar');
    const result = document.getElementById('result');
    
    progBox.style.display = 'block';
    progBar.style.width = '0%';
    result.innerHTML = '获取通行证中...';

    try {
        // 1. 拿 Token
        const res = await fetch('/api/qiniu-token', { method: 'POST' });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // 2. 准备数据
        const formData = new FormData();
        formData.append('token', data.token);
        formData.append('file', file);
        
        // 随机文件名
        const ext = file.name.split('.').pop();
        const key = Date.now() + '_' + Math.floor(Math.random()*10000) + '.' + ext;
        formData.append('key', key);

        result.innerHTML = '正在上传...';

        // 3. 直传七牛
        const xhr = new XMLHttpRequest();
        xhr.open('POST', QINIU_UPLOAD_URL, true);
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                progBar.style.width = (e.loaded / e.total) * 100 + '%';
            }
        };
        xhr.onload = function() {
            if (xhr.status === 200) {
                result.innerHTML = `上传成功！<br><a href="${DOMAIN}/${key}" target="_blank" style="color:#00d4ff;">点击这里查看文件</a>`;
                progBox.style.display = 'none';
            } else {
                result.innerHTML = '上传失败：' + xhr.responseText;
                progBox.style.display = 'none';
            }
        };
        xhr.send(formData);

    } catch (err) {
        result.innerHTML = '出错啦：' + err.message;
        progBox.style.display = 'none';
    }
}
</script>
</body>
</html>
