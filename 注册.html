/* ===== Modal Overlay ===== */
.modal-overlay {

/* ===== Slider CAPTCHA ===== */

<body>

<!-- ===== Registration Form ===== -->
<div class="register-card" id="registerCard">
    <h1>创建账户</h1>
    <p class="subtitle">填写以下信息完成注册</p>

    <div class="form-group">
        <label>性别<span class="required-star">*</span></label>
        <div class="gender-options">
            <div class="gender-btn" data-gender="男" onclick="selectGender(this)">男</div>
            <div class="gender-btn" data-gender="女" onclick="selectGender(this)">女</div>
            <div class="gender-btn active" data-gender="其他" onclick="selectGender(this)">其他</div>
        </div>
    </div>

    <div class="form-group">
        <label>用户名<span class="required-star">*</span></label>
        <div class="input-wrapper">
            <input type="text" id="username" placeholder="请输入用户名" oninput="checkUsername()">
            <span class="check-icon" id="usernameCheck">✓</span>
        </div>
        <div class="helper-text" id="usernameHelper">请输入4-20位字符的用户名</div>
    </div>

    <div class="form-group">
        <label>密码<span class="required-star">*</span></label>
        <div class="input-wrapper">
            <input type="password" id="password" placeholder="请输入密码" oninput="checkPassword()">
            <span class="check-icon" id="passwordCheck">✓</span>
        </div>
        <div class="helper-text" id="passwordHelper">请输入6位以上包含大小写字母、数字及特殊字符的密码</div>
    </div>

    <div class="form-group">
        <label>手机号<span class="required-star">*</span></label>
        <div class="input-wrapper">
            <input type="text" id="phone" placeholder="请输入11位手机号" maxlength="11" oninput="checkPhone()">
            <span class="check-icon" id="phoneCheck">✓</span>
        </div>
        <div class="helper-text" id="phoneHelper">请输入有效的手机号码</div>
    </div>

    <button class="register-btn" onclick="startRegistration()">注册</button>
</div>

<!-- ===== Modal Container ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox" style="position:relative;">
        <span class="step-indicator" id="stepIndicator"></span>
        <span class="modal-close" onclick="closeModal()">×</span>
        <div id="modalContent"></div>
    </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast">
    <div class="toast-icon">✓</div>
    <div class="toast-text">注册成功</div>
</div>

<script>
// ===== Gender Selection =====
function selectGender(el) {
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
}

// ===== Form Validation =====
function checkUsername() {
    const val = document.getElementById('username').value;
    const helper = document.getElementById('usernameHelper');
    const check = document.getElementById('usernameCheck');
    const input = document.getElementById('username');
    if (val.length >= 4 && val.length <= 20) {
        input.classList.remove('error'); input.classList.add('success');
        check.classList.add('show');
        helper.className = 'helper-text success';
        helper.textContent = '该用户名可用';
    } else {
        input.classList.remove('success'); input.classList.remove('error');
        check.classList.remove('show');
        helper.className = 'helper-text';
        helper.textContent = '请输入4-20位字符的用户名';
    }
}

function checkPassword() {
    const val = document.getElementById('password').value;
    const helper = document.getElementById('passwordHelper');
    const check = document.getElementById('passwordCheck');
    const input = document.getElementById('password');
    const hasUpper = /[A-Z]/.test(val);
    const hasLower = /[a-z]/.test(val);
    const hasNum = /[0-9]/.test(val);
    const hasSpecial = /[^A-Za-z0-9]/.test(val);
    if (val.length >= 6 && hasUpper && hasLower && hasNum && hasSpecial) {
        input.classList.remove('error'); input.classList.add('success');
        check.classList.add('show');
        helper.className = 'helper-text success';
        helper.textContent = '该密码可用';
    } else {
        input.classList.remove('success');
        check.classList.remove('show');
        helper.className = 'helper-text';
        helper.textContent = '请输入6位以上包含大小写字母、数字及特殊字符的密码';
    }
}

function checkPhone() {
    const val = document.getElementById('phone').value;
    const helper = document.getElementById('phoneHelper');
    const check = document.getElementById('phoneCheck');
    const input = document.getElementById('phone');
    if (val.length === 11) {
        // Absurd: phone number segment is always "occupied"
        input.classList.remove('success'); input.classList.add('error');
        check.classList.remove('show');
        helper.className = 'helper-text error';
        helper.textContent = '该手机号段已被占用';
    } else {
        input.classList.remove('error'); input.classList.remove('success');
        check.classList.remove('show');
        helper.className = 'helper-text';
        helper.textContent = '请输入有效的手机号码';
    }
}

// ===== Registration Flow =====
const steps = [
    { title: '安全验证', type: 'slider' },
    { title: '用户调研', type: 'genshin' },
    { title: '灵魂绑定契约', type: 'contract' },
    { title: '设置双因素认证 (2FA)', type: 'set2fa' },
    { title: '验证双因素认证', type: 'verify2fa' },
    { title: '安全提问', type: 'math1' },
    { title: '系统审核中', type: 'progress' },
    { title: '声纹验证', type: 'voiceprint' },
    { title: '色彩辨别', type: 'color' },
    { title: '记忆力测试', type: 'memory' },
    { title: '时间验证', type: 'time' },
    { title: '解方程', type: 'equation' },
    { title: '圆周率记忆', type: 'pi' },
    { title: '质数挑战', type: 'prime' },
    { title: '简单算术', type: 'arithmetic' },
    { title: '终极放弃', type: 'giveup' },
];

let currentStep = 0;
let twoFACode = '';

function startRegistration() {
    currentStep = 0;
    showStep();
}

function showStep() {
    if (currentStep >= steps.length) {
        showSuccess();
        return;
    }
    const step = steps[currentStep];
    document.getElementById('stepIndicator').textContent = `验证 ${currentStep + 1} / ${steps.length}`;
    const content = document.getElementById('modalContent');
    
    switch(step.type) {
        case 'slider': content.innerHTML = sliderHTML(); initSlider(); break;
        case 'genshin': content.innerHTML = genshinHTML(); break;
        case 'contract': content.innerHTML = contractHTML(); break;
        case 'set2fa': content.innerHTML = set2faHTML(); break;
        case 'verify2fa': content.innerHTML = verify2faHTML(); break;
        case 'math1': content.innerHTML = math1HTML(); break;
        case 'progress': content.innerHTML = progressHTML(); initProgress(); break;
        case 'voiceprint': content.innerHTML = voiceprintHTML(); break;
        case 'color': content.innerHTML = colorHTML(); break;
        case 'memory': content.innerHTML = memoryHTML(); initMemory(); break;
        case 'time': content.innerHTML = timeHTML(); break;
        case 'equation': content.innerHTML = equationHTML(); break;
        case 'pi': content.innerHTML = piHTML(); break;
        case 'prime': content.innerHTML = primeHTML(); break;
        case 'arithmetic': content.innerHTML = arithmeticHTML(); break;
        case 'giveup': content.innerHTML = giveupHTML(); break;
    }
    
    document.getElementById('modalOverlay').classList.add('show');
}

function nextStep() {
    currentStep++;
    setTimeout(() => {
        document.getElementById('modalOverlay').classList.remove('show');
        setTimeout(() => showStep(), 200);
    }, 400);
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

function showSuccess() {
    document.getElementById('modalOverlay').classList.remove('show');
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2500);
}

// ===== Step HTML Generators =====

function sliderHTML() {
    return `
        <h2>安全验证</h2>
        <p class="modal-desc">请拖动滑块完成人机验证</p>
        <div class="slider-container">
            <div class="slider-track" id="sliderTrack">
                <div class="slider-fill" id="sliderFill"></div>
                <div class="slider-handle" id="sliderHandle">▶</div>
            </div>
            <div class="slider-text" id="sliderText">向右拖动滑块</div>
        </div>
    `;
}

function initSlider() {
    const handle = document.getElementById('sliderHandle');
    const fill = document.getElementById('sliderFill');
    const track = document.getElementById('sliderTrack');
    const text = document.getElementById('sliderText');
    let isDragging = false;
    let startX = 0;
    let currentX = 0;

    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag);

    function startDrag(e) {
        isDragging = true;
        startX = e.clientX || e.touches[0].clientX;
        currentX = parseInt(handle.style.left) || 0;
        e.preventDefault();
    }

    document.addEventListener('mousemove', onDrag);
    document.addEventListener('touchmove', onDrag);

    function onDrag(e) {
        if (!isDragging) return;
        const x = e.clientX || (e.touches && e.touches[0].clientX);
        if (x === undefined) return;
        let offset = currentX + (x - startX);
        const maxOffset = track.offsetWidth - handle.offsetWidth;
        if (offset < 0) offset = 0;
        if (offset > maxOffset) offset = maxOffset;
        handle.style.left = offset + 'px';
        fill.style.width = (offset + handle.offsetWidth) + 'px';
        if (offset >= maxOffset - 5) {
            isDragging = false;
            text.textContent = '验证成功';
            text.style.color = '#27ae60';
            handle.innerHTML = '✓';
            handle.style.color = '#27ae60';
            handle.style.borderColor = '#27ae60';
            setTimeout(() => nextStep(), 600);
        }
    }

    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('touchend', () => isDragging = false);
}

function genshinHTML() {
    return `
        <h2>用户调研</h2>
        <p class="modal-desc">请问您是否玩过《原神》?</p>
        <div class="yesno-row">
            <button class="yesno-btn yes" onclick="nextStep()">是</button>
            <button class="yesno-btn no" onclick="nextStep()">否</button>
        </div>
        <p class="genshin-text">原神牛逼，快去玩原神</p>
    `;
}

function contractHTML() {
    return `
        <h2>灵魂绑定契约</h2>
        <p class="modal-desc">请仔细阅读以下条款:</p>
        <ul class="contract-list">
