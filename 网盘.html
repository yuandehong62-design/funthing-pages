                    <div class="modal-dialog">
                        <div style="font-weight:600;margin-bottom:8px;">安全验证</div>
                        <div class="captcha-box" style="background:repeating-linear-gradient(45deg,#eee,#eee 10px,#ddd 10px,#ddd 20px);">
                            ${code}
                        </div>
                        <input id="captchaInput" placeholder="请输入上方验证码" style="width:100%;padding:8px;margin:10px 0;border:1px solid #ccc;border-radius:4px;font-size:16px;">
                        <button onclick="window._verifyCaptcha('${code}')" style="width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;">确认</button>
                        <div style="font-size:11px;color:#999;margin-top:8px;">点击确认继续</div>
                    </div>
                </div>`;
            }
            window._verifyCaptcha = function(code) {
                const input = document.getElementById('captchaInput');
                if(input && input.value.toUpperCase() === code) {
                    modalRoot.innerHTML = '';
                    proceedToConfirm();
                } else {
                    toast('验证码错误，请重试');
                    if(input) input.value = '';
                }
            };

            function proceedToConfirm() {
                const lv = getLevel();
                modalRoot.innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-dialog">
                        <div style="font-weight:600;margin-bottom:8px;">下载确认</div>
                        <p style="font-size:14px;">当前速度 <b style="color:#e67e22;">${formatSpeed(lv.speed)}</b>，预计耗时较长，建议开通VIP。</p>
                        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
                            <button onclick="window._finalDownload()" style="flex:1;padding:10px;background:#fff;border:1px solid #ccc;border-radius:8px;font-size:14px;cursor:pointer;min-width:100px;">继续下载</button>
                            <button onclick="window._finalGoVIP()" style="flex:1;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;min-width:100px;">开通VIP</button>
                        </div>
                    </div>
                </div>`;
            }
            window._finalDownload = function() {
                modalRoot.innerHTML = '';
                startDownloadReal();
            };
            window._finalGoVIP = function() {
                modalRoot.innerHTML = '';
                openVIPPanel();
            };

            function resetDownloadState() {
                downloadedBytes = 0;
                progressFill.classList.remove('completed');
                progressFill.style.width = '0%';
                updateProgressUI();
            }

            function startDownloadReal() {
                resetDownloadState();
                isDownloading = true;
                lastTickTime = Date.now();
                progressPanel.classList.add('visible');
                btnDownload.textContent = '⏸ 暂停下载';
                btnDownload.classList.add('downloading');
                updateProgressUI();
                if(downloadTimerId) clearInterval(downloadTimerId);
                downloadTimerId = setInterval(downloadTick, 100);
            }
            function downloadTick() {
                if(!isDownloading) return;
                const now = Date.now();
                const elapsed = (now - lastTickTime)/1000;
                lastTickTime = now;
                const inc = getLevel().speed * elapsed;
                downloadedBytes = Math.min(downloadedBytes + inc, FILE_SIZE);
                updateProgressUI();
                if(downloadedBytes >= FILE_SIZE) completeDownload();
            }
            function completeDownload() {
                isDownloading = false;
                if(downloadTimerId) { clearInterval(downloadTimerId); downloadTimerId=null; }
                downloadedBytes = FILE_SIZE;
                updateProgressUI();
                progressFill.classList.add('completed');
                btnDownload.textContent = '✅ 下载完成 (重新下载)';
                btnDownload.classList.remove('downloading');
                btnDownload.classList.add('completed');
                toast('下载完成！');
            }
            function pauseDownload() {
                isDownloading = false;
                if(downloadTimerId) { clearInterval(downloadTimerId); downloadTimerId=null; }
                btnDownload.textContent = '⬇️ 继续下载';
                btnDownload.classList.remove('downloading');
                updateProgressUI();
            }

            // ========== VIP升级面板 ==========
            function openVIPPanel() {
                const cur = getLevel();
                const nextId = currentLevelId+1;
                const next = LEVELS[nextId] || null;
                let body = '';
                if(next) {
                    body = `
                        <div style="background:#f7f9fc;padding:12px;border-radius:8px;margin-bottom:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;">
                            <span>当前</span><strong>${cur.name}</strong><span>${formatSpeed(cur.speed)}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:12px;text-align:center;flex-wrap:wrap;justify-content:center;">
                            <div style="flex:1;background:#f5f7fa;padding:12px;border-radius:8px;min-width:80px;">${cur.name}<br>广告${cur.maxAds}个</div>
                            <span>→</span>
                            <div style="flex:1;background:#f0f7ff;padding:12px;border-radius:8px;border:1px solid #108cee;min-width:80px;"><strong>${next.name}</strong><br>广告${next.maxAds}个</div>
                        </div>
                        <button onclick="window.upgradeTo(${nextId})" style="width:100%;margin-top:16px;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:24px;font-weight:bold;font-size:16px;cursor:pointer;">升级 ¥${next.price}</button>`;
                } else {
                    body = '<p style="text-align:center;color:#27ae60;font-weight:bold;">已是SVIP</p>';
                }
                modalRoot.innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) modalRoot.innerHTML=''">
                    <div class="modal-dialog">${body}</div>
                </div>`;
            }
            window.upgradeTo = function(targetId) {
                if(targetId !== currentLevelId+1) return;
                currentLevelId = targetId;
                refreshUI();
                modalRoot.innerHTML = '';
                toast(`升级为 ${getLevel().name}，广告减少至${getLevel().maxAds}个`);
                refreshAds();
                if(isDownloading) lastTickTime = Date.now();
            };
            window.openVIPPanel = openVIPPanel;

            // 初始化
            refreshUI();
            for(let i=0;i<getLevel().maxAds;i++) spawnAd();
            scheduleAd();
            window.handleDownloadClick = handleDownloadClick;
        })();
    </script>
</body>
