<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat · SenseNova</title>
<style>
:root {
    --bg: #0a0e1a;
    --border: rgba(0, 212, 255, 0.15);
    --accent: #00d4ff;
    --text: #e2e8f0;
    --text-dim: rgba(255,255,255,0.45);
    --user-bg: rgba(0, 212, 255, 0.12);
    --ai-bg: rgba(255,255,255,0.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: rgba(10, 14, 26, 0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
    gap: 12px;
    flex-wrap: wrap;
}
.topbar h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, #00d4ff, #7b2ffc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
}
.topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.model-select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
}
.model-select {
    padding: 6px 30px 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    min-width: 160px;
}
.model-select option { background: #1a1e2a; color: #e2e8f0; }
.model-select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px;
    pointer-events: none;
    color: var(--text-dim);
    font-size: 0.7rem;
}
.model-select.loading { color: var(--text-dim); cursor: wait; }

.btn-icon {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
}
.btn-icon:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0, 212, 255, 0.08);
}
.btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 12px;
}
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.25); border-radius: 3px; }
.chat-inner { max-width: 820px; margin: 0 auto; }

.msg {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    animation: msgIn 0.3s ease-out;
}
@keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    background: linear-gradient(135deg, #1e2538, #2a3450);
    border: 1px solid var(--border);
}
.msg.user .msg-avatar {
    background: linear-gradient(135deg, #00d4ff, #0077b6);
    border-color: transparent;
}

.msg-bubble {
    max-width: 76%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 0.92rem;
    line-height: 1.75;
    word-break: break-word;
    white-space: pre-wrap;
}
.msg.user .msg-bubble {
    background: var(--user-bg);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-bottom-right-radius: 4px;
}
.msg.ai .msg-bubble {
    background: var(--ai-bg);
    border: 1px solid rgba(255,255,255,0.06);
    border-bottom-left-radius: 4px;
}

.msg-bubble code {
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.85em;
    color: #00d4ff;
}
.msg-bubble pre {
    background: rgba(0,0,0,0.5);
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 10px 0;
    border: 1px solid rgba(0,212,255,0.12);
}
.msg-bubble pre code { background: none; padding: 0; color: #c8d8f0; }

.typing-cursor::after {
    content: '▋';
    animation: blink 1s step-end infinite;
    color: var(--accent);
    margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

.msg.error .msg-bubble {
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.3);
    color: #fca5a5;
}

.welcome {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
}
.welcome-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.6; }
.welcome h2 { font-size: 1.3rem; color: #fff; margin-bottom: 8px; font-weight: 600; }
.welcome p { font-size: 0.88rem; line-height: 1.8; }
.welcome .hint { margin-top: 20px; font-size: 0.8rem; color: rgba(255,255,255,0.25); }

.input-bar {
    flex-shrink: 0;
    padding: 12px 16px 16px;
    background: rgba(10, 14, 26, 0.95);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
}
.input-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.input-box { flex: 1; position: relative; }
textarea {
    width: 100%;
    min-height: 48px;
    max-height: 160px;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
    line-height: 1.5;
    resize: none;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
}
textarea::placeholder { color: rgba(255,255,255,0.25); }

.send-btn {
    width: 48px; height: 48px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #00d4ff, #0077b6);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}
.send-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 212, 255, 0.35);
}
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* 设置弹窗 */
.settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,0.75);
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.settings-overlay.active { display: flex; }
.settings-box {
    background: #1a1e2a;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 440px;
    width: 100%;
}
.settings-box h2 { font-size: 1.15rem; margin-bottom: 6px; color: #fff; }
.settings-box .sub {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 20px;
    line-height: 1.7;
}
.field { margin-bottom: 16px; }
.field label {
    display: block;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
}
.field input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-family: inherit;
    font-size: 0.86rem;
    outline: none;
    transition: border-color 0.25s ease;
}
.field input:focus { border-color: var(--accent); }
.field .tip { font-size: 0.72rem; color: rgba(255,255,255,0.25); margin-top: 5px; line-height: 1.6; }
.settings-actions { display: flex; gap: 10px; margin-top: 22px; }
.settings-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
}
.settings-actions button.primary {
    background: linear-gradient(135deg, #00d4ff, #0077b6);
    border-color: transparent;
    color: #fff;
}
.settings-actions button:hover { transform: translateY(-1px); }

@media (max-width: 640px) {
    .topbar { padding: 10px 12px; }
    .topbar h1 { font-size: 0.95rem; }
    .model-select { font-size: 0.74rem; padding: 5px 26px 5px 10px; min-width: 130px; }
    .btn-icon { font-size: 0.72rem; padding: 5px 10px; }
    .msg-bubble { max-width: 85%; font-size: 0.88rem; }
    .chat-area { padding: 16px 10px 8px; }
    .input-bar { padding: 10px 10px 12px; }
    .send-btn { width: 44px; height: 44px; }
}
</style>
</head>
<body>

<div class="topbar">
    <h1>✦ AI Chat</h1>
    <div class="topbar-right">
        <div class="model-select-wrap">
            <select class="model-select" id="modelSelect">
                <option value="">加载模型中…</option>
            </select>
        </div>
        <button class="btn-icon" id="refreshModelsBtn" onclick="loadModels(true)" title="重新拉取模型列表">🔄</button>
        <button class="btn-icon" onclick="clearChat()">🗑 清空</button>
        <button class="btn-icon" onclick="openSettings()">⚙ 设置</button>
    </div>
</div>

<div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcomeScreen">
            <div class="welcome-icon">🤖</div>
            <h2>SenseNova AI 对话</h2>
            <p>模型列表会自动从 API 拉取，直接输入开始对话。</p>
            <p class="hint">Powered by Cloudflare Pages Functions</p>
        </div>
    </div>
</div>

<div class="input-bar">
    <div class="input-inner">
        <div class="input-box">
            <textarea id="userInput" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-box">
        <h2>⚙ 设置</h2>
        <p class="sub">API Key 已内置在服务端。模型列表会自动拉取。</p>
        <div class="field">
            <label>自定义 API 地址（留空用本站代理）</label>
            <input type="text" id="baseUrlInput" placeholder="留空即可">
            <div class="tip">留空 → 请求 /api/chat 和 /api/models（推荐）。填了 → 浏览器直连该地址（会被 CORS 拦）。</div>
        </div>
        <div class="field">
            <label>系统提示词（可选）</label>
            <input type="text" id="systemPromptInput" placeholder="例如：你是一个专业的中文助手">
        </div>
        <div class="settings-actions">
            <button onclick="closeSettings()">取消</button>
            <button class="primary" onclick="saveSettings()">保存</button>
        </div>
    </div>
</div>

<script>
const KEYS = {
    systemPrompt: 'ai_chat_system_prompt',
    model: 'ai_chat_model',
    baseUrl: 'ai_chat_base_url',
    modelsCache: 'ai_chat_models_cache'
};

// 兜底模型列表（API 拉不到时用）
const FALLBACK_MODELS = [
    'sensenova-6.8-flash-lite',
    'sensenova-6.7-flash-lite',
    'deepseek-v4-pro',
    'deepseek-v4-flash',
    'glm-5.2',
    'kimi-k3'
];

let conversation = [];
let isGenerating = false;
let abortController = null;
let modelList = [];

const chatArea = document.getElementById('chatArea');
const chatInner = document.getElementById('chatInner');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const modelSelect = document.getElementById('modelSelect');
const refreshBtn = document.getElementById('refreshModelsBtn');

// ============================================================
//  初始化
// ============================================================
(function init() {
    userInput.addEventListener('input', autoResize);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 先尝试用缓存渲染，再拉新的
    const cached = localStorage.getItem(KEYS.modelsCache);
    if (cached) {
        try {
            modelList = JSON.parse(cached);
            renderModelSelect();
        } catch {}
    }

    loadModels(false);
})();

function autoResize() {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
}

// ============================================================
//  模型列表
// ============================================================
async function loadModels(showToast) {
    refreshBtn.disabled = true;
    modelSelect.classList.add('loading');

    // 显示加载中，但不覆盖已有列表
    if (modelList.length === 0) {
        modelSelect.innerHTML = '<option value="">加载模型中…</option>';
    }

    const customBase = localStorage.getItem(KEYS.baseUrl) || '';
    const url = customBase ? customBase + '/models' : '/api/models';

    try {
        const res = await fetch(url, { method: 'GET' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (data.models && Array.isArray(data.models) && data.models.length > 0) {
            modelList = data.models;
        } else {
            modelList = FALLBACK_MODELS;
        }

        localStorage.setItem(KEYS.modelsCache, JSON.stringify(modelList));
        renderModelSelect();

        if (showToast) flashBtn(refreshBtn, '✓');
    } catch (err) {
        // 拉取失败 → 用兜底列表
        if (modelList.length === 0) {
            modelList = FALLBACK_MODELS;
            renderModelSelect();
        }
        if (showToast) flashBtn(refreshBtn, '✕');
    } finally {
        modelSelect.classList.remove('loading');
        refreshBtn.disabled = false;
    }
}

function renderModelSelect() {
    const saved = localStorage.getItem(KEYS.model);

    modelSelect.innerHTML = modelList
        .map(id => `<option value="${id}">${id}</option>`)
        .join('');

    // 恢复之前选择；如果之前选的模型不在了，用第一个
    if (saved && modelList.includes(saved)) {
        modelSelect.value = saved;
    } else if (modelList.length > 0) {
        modelSelect.value = modelList[0];
        localStorage.setItem(KEYS.model, modelList[0]);
    }

    modelSelect.onchange = () => {
        localStorage.setItem(KEYS.model, modelSelect.value);
    };
}

function flashBtn(btn, txt) {
    const original = btn.textContent;
    btn.textContent = txt;
    setTimeout(() => { btn.textContent = original; }, 1000);
}

// ============================================================
//  设置
// ============================================================
function openSettings() {
    document.getElementById('baseUrlInput').value = localStorage.getItem(KEYS.baseUrl) || '';
    document.getElementById('systemPromptInput').value = localStorage.getItem(KEYS.systemPrompt) || '';
    document.getElementById('settingsOverlay').classList.add('active');
}
function closeSettings() {
    document.getElementById('settingsOverlay').classList.remove('active');
}
function saveSettings() {
    localStorage.setItem(KEYS.baseUrl, document.getElementById('baseUrlInput').value.trim().replace(/\/+$/, ''));
    localStorage.setItem(KEYS.systemPrompt, document.getElementById('systemPromptInput').value.trim());
    closeSettings();
    // 改了地址，重新拉一次模型
    loadModels(true);
}

// ============================================================
//  发送消息
// ============================================================
async function sendMessage() {
    if (isGenerating) return;
    const text = userInput.value.trim();
    if (!text) return;

    if (!modelSelect.value) {
        alert('模型列表还没加载好，请稍等或点一下刷新按钮');
        return;
    }

    const welcome = document.getElementById('welcomeScreen');
    if (welcome) welcome.style.display = 'none';

    appendMessage('user', text);
    conversation.push({ role: 'user', content: text });
    userInput.value = '';
    autoResize();

    const aiBubble = appendMessage('ai', '');
    aiBubble.classList.add('typing-cursor');

    isGenerating = true;
    sendBtn.disabled = true;

    const customBase = localStorage.getItem(KEYS.baseUrl) || '';
    const url = customBase ? customBase + '/chat/completions' : '/api/chat';

    const systemPrompt = localStorage.getItem(KEYS.systemPrompt) || '';
    const messages = [];
    if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
    messages.push(...conversation);

    // 只发 SenseNova 接受的字段
    const body = {
        model: modelSelect.value,
        messages: messages,
        stream: true,
        temperature: 0.7,
        max_tokens: 4096
    };

    abortController = new AbortController();

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: abortController.signal
        });

        if (!response.ok) {
            const errText = await response.text();
            let msg = `HTTP ${response.status}`;
            try {
                const j = JSON.parse(errText);
                msg += ': ' + (j.error?.message || j.error || errText.slice(0, 300));
            } catch {
                msg += ': ' + errText.slice(0, 300);
            }
            throw new Error(msg);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullText = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
                const t = line.trim();
                if (!t || !t.startsWith('data: ')) continue;
                const data = t.slice(6);
                if (data === '[DONE]') continue;
                try {
                    const j = JSON.parse(data);
                    const delta = j.choices?.[0]?.delta?.content;
                    if (delta) {
                        fullText += delta;
                        aiBubble.textContent = fullText;
                        scrollToBottom();
                    }
                } catch {}
            }
        }

        aiBubble.classList.remove('typing-cursor');
        if (fullText) {
            conversation.push({ role: 'assistant', content: fullText });
        } else {
            aiBubble.textContent = '（没有收到内容）';
        }

    } catch (err) {
        aiBubble.classList.remove('typing-cursor');
        aiBubble.parentElement.classList.add('error');
        aiBubble.textContent = '❌ ' + err.message;
        conversation.pop();
    } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        abortController = null;
    }
}

// ============================================================
//  DOM 工具
// ============================================================
function appendMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + (role === 'user' ? 'user' : 'ai');

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatInner.appendChild(msg);
    scrollToBottom();
    return bubble;
}

function scrollToBottom() {
    requestAnimationFrame(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
    });
}

function clearChat() {
    if (isGenerating && abortController) abortController.abort();
    conversation = [];
    chatInner.innerHTML = `
        <div class="welcome" id="welcomeScreen">
            <div class="welcome-icon">🤖</div>
            <h2>SenseNova AI 对话</h2>
            <p>模型列表会自动从 API 拉取，直接输入开始对话。</p>
            <p class="hint">Powered by Cloudflare Pages Functions</p>
        </div>
    `;
}

document.getElementById('settingsOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
});
</script>
</body>
</html>
